<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบทดสอบคณิตศาสตร์ (Math Quiz 3)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="mathjax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-lg border border-slate-200">
    <header class="border-b pb-4 mb-8">
      <h1 class="text-3xl font-bold text-slate-900">คลังแบบทดสอบคณิตศาสตร์ ชุดที่ 3</h1>
      <p class="text-slate-500 mt-1">ทดสอบความรู้และทักษะ พร้อมระบบตรวจคำตอบและเฉลยวิธีทำอย่างละเอียด</p>
    </header>

    <section class="mb-10">
      <h2 class="text-xl font-bold text-indigo-600 mb-4 pb-2 border-b">ตอนที่ 1: โจทย์เลือกตอบ (ปรนัย)</h2>
      <div id="mcq-container" class="space-y-6"></div>
    </section>

    <section class="mb-6">
      <h2 class="text-xl font-bold text-indigo-600 mb-4 pb-2 border-b">ตอนที่ 2: โจทย์แสดงวิธีทำ (อัตนัย)</h2>
      <div id="subjective-container" class="space-y-6"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
